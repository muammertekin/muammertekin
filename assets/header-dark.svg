<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Muammer Tekin — mobile &amp; backend developer. I build mobile apps, and the systems behind them.">
<title>Muammer Tekin — mobile &amp; backend developer. I build mobile apps, and the systems behind them.</title>
<style>
  .sans{font-family:ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}
  .rise{animation:rise .8s cubic-bezier(.2,.75,.2,1) backwards}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}}
  .caret{animation:blink 1.1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
  .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}
  @keyframes pulse{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.9);opacity:0}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="11" cy="11" r="1.1" fill="#ffffff" fill-opacity="0.09"/>
  </pattern>
  <radialGradient id="fade" cx="50%" cy="38%" r="65%">
    <stop offset="35%" stop-color="#fff"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <mask id="dotmask"><rect width="100%" height="100%" fill="url(#fade)"/></mask>
  <radialGradient id="halo" cx="50%" cy="0%" r="60%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="card"><rect width="1200" height="380" rx="24"/></clipPath>
</defs>
<g clip-path="url(#card)">
  <rect width="1200" height="380" fill="#0a0a0c"/>
  <rect width="1200" height="380" fill="url(#halo)"/>
  <rect width="1200" height="380" fill="url(#dots)" mask="url(#dotmask)"/>
</g>
<rect x=".5" y=".5" width="1199" height="379" rx="23.5" fill="none" stroke="#24252b"/>

<g class="rise">
  <rect x="150" y="44" width="900" height="292" rx="20" fill="#131418" fill-opacity=".9" stroke="#24252b"/>
  <path d="M170 44.5 H1030" stroke="#33343b"/>
  <circle cx="178" cy="66" r="6" fill="#ff5f57"/><circle cx="198" cy="66" r="6" fill="#febc2e"/><circle cx="218" cy="66" r="6" fill="#28c840"/>
  <text x="600" y="70.5" text-anchor="middle" class="mono" font-size="13" fill="#7d808a">hello.md</text>
  <path d="M150 88 H1050" stroke="#24252b"/>
</g>
<text x="196" y="138" class="mono rise" style="animation-delay:.15s" font-size="13.5" letter-spacing="2.2" fill="#ffb547">MOBILE &amp; BACKEND DEVELOPER</text>
<text x="193" y="200" class="sans rise" style="animation-delay:.25s" font-size="60" font-weight="600" letter-spacing="-1.8" fill="#f3f3f5">Muammer Tekin</text>
<text x="196" y="244" class="sans rise" style="animation-delay:.35s" font-size="22" fill="#b1b3bb">I build mobile apps, and the systems behind them.</text>
<g class="rise" style="animation-delay:.45s">
  <text x="196" y="298" class="mono" font-size="14" fill="#7d808a"><tspan fill="#ffb547">›</tspan>  shipping labellingo</text>
  <rect class="caret" x="380.5" y="285" width="8.5" height="17" rx="1.5" fill="#ffb547"/>
</g>
<g class="rise" style="animation-delay:.55s">
  <rect x="806" y="112" width="208" height="70" rx="15" fill="#1b1c21" stroke="#24252b"/>
  <circle class="pulse" cx="830" cy="136" r="9" fill="#ffb547" fill-opacity=".25"/>
  <circle cx="830" cy="136" r="4" fill="#ffb547"/>
  <text x="846" y="140.5" class="mono" font-size="12" fill="#7d808a">now building</text>
  <text x="824" y="166" class="sans" font-size="19" font-weight="600" letter-spacing="-.3" fill="#f3f3f5">Labellingo</text>
</g>
<text x="1014" y="298" text-anchor="end" class="mono rise" style="animation-delay:.6s" font-size="13" fill="#7d808a">konya, turkey</text>
</svg>
