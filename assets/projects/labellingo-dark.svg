<svg xmlns="http://www.w3.org/2000/svg" width="600" height="240" viewBox="0 0 600 240" role="img" aria-label="Labellingo: Snap any ingredients label, in any language, and read it in yours: allergens flagged, every additive explained. Built with Flutter, NestJS, MongoDB, Claude API.">
<title>Labellingo: Snap any ingredients label, in any language, and read it in yours: allergens flagged, every additive explained. Built with Flutter, NestJS, MongoDB, Claude API.</title>
<style>
  .sans{font-family:ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}
  .rise{animation:rise .8s cubic-bezier(.2,.75,.2,1) backwards}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}}
  
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="11" cy="11" r="1.1" fill="#ffffff" fill-opacity="0.09"/>
  </pattern>
  <radialGradient id="fade" cx="50%" cy="38%" r="65%">
    <stop offset="35%" stop-color="#fff"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <mask id="dotmask"><rect width="100%" height="100%" fill="url(#fade)"/></mask>
  <radialGradient id="halo" cx="50%" cy="0%" r="60%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/><stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="card"><rect width="600" height="240" rx="24"/></clipPath>
</defs>
<g clip-path="url(#card)">
  <rect width="600" height="240" fill="#0a0a0c"/>
  <rect width="600" height="240" fill="url(#halo)"/>
  <rect width="600" height="240" fill="url(#dots)" mask="url(#dotmask)"/>
</g>
<rect x=".5" y=".5" width="599" height="239" rx="23.5" fill="none" stroke="#24252b"/>

<g class="rise">
  <text x="40" y="52" class="mono" font-size="12" letter-spacing="1.8" fill="#ffb547">AI · FOOD &amp; COSMETICS</text>
  <text x="560" y="52" text-anchor="end" class="mono" font-size="12" fill="#7d808a">labellingo.com</text>
  <text x="38" y="100" class="sans" font-size="36" font-weight="600" letter-spacing="-.9" fill="#f3f3f5">Labellingo</text>
  <text x="40" y="136" class="sans" font-size="17" fill="#b1b3bb">Snap any ingredients label, in any language, and read it</text>
  <text x="40" y="160" class="sans" font-size="17" fill="#b1b3bb">in yours: allergens flagged, every additive explained.</text>
</g>
<g class="rise" style="animation-delay:.15s">
  <rect x="40" y="184" width="79.3" height="28" rx="14" fill="#1b1c21" stroke="#24252b"/>
  <text x="79.7" y="202.5" text-anchor="middle" class="mono" font-size="13" fill="#b1b3bb">Flutter</text>
  <rect x="127.30000000000001" y="184" width="71.4" height="28" rx="14" fill="#1b1c21" stroke="#24252b"/>
  <text x="163.0" y="202.5" text-anchor="middle" class="mono" font-size="13" fill="#b1b3bb">NestJS</text>
  <rect x="206.70000000000002" y="184" width="79.3" height="28" rx="14" fill="#1b1c21" stroke="#24252b"/>
  <text x="246.4" y="202.5" text-anchor="middle" class="mono" font-size="13" fill="#b1b3bb">MongoDB</text>
  <rect x="294" y="184" width="103.0" height="28" rx="14" fill="#1b1c21" stroke="#24252b"/>
  <text x="345.5" y="202.5" text-anchor="middle" class="mono" font-size="13" fill="#b1b3bb">Claude API</text>
</g>
</svg>
